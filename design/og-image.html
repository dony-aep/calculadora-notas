<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>CalNotas · og-image</title>
  <!-- Fuente de public/og-image.png (1200×630). Cómo regenerarlo: ver CLAUDE.md, «Imagen para compartir». -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&display=block">
  <style>
    html, body { margin: 0; }
    .banner {
      position: relative; width: 1200px; height: 630px; overflow: hidden;
      background: #121212; color: #f2f2f2; font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .txt { position: absolute; left: 88px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; gap: 20px; width: 600px; }
    .name { font-size: 132px; font-weight: 800; letter-spacing: -0.045em; line-height: 0.9; }
    .tagline { font-size: 34px; font-weight: 600; line-height: 1.2; color: #a3a3a3; letter-spacing: -0.01em; }
    .url { position: absolute; left: 88px; bottom: 56px; font-size: 22px; font-weight: 600; color: #737373; }
    .mark { position: absolute; right: 88px; top: 50%; width: 290px; height: 197px; transform: translateY(-50%); }
  </style>
</head>
<body>
  <div class="banner">
    <div class="txt">
      <div class="name">CalNotas</div>
      <div class="tagline">Calculadora de notas por cortes</div>
    </div>
    <!-- Logo de las barras, el mismo dibujo que public/favicon.svg -->
    <svg class="mark" viewBox="20 96 472 320" fill="#f2f2f2" aria-hidden="true">
      <rect x="24" y="100" width="346" height="50" rx="25"/>
      <rect x="384" y="100" width="103" height="50" rx="25"/>
      <rect x="24" y="231" width="246" height="50" rx="25"/>
      <rect x="283" y="231" width="204" height="50" rx="25"/>
      <rect x="24" y="362" width="144" height="50" rx="25"/>
      <rect x="181" y="362" width="306" height="50" rx="25"/>
    </svg>
    <div class="url">calnotas.vercel.app</div>
  </div>
</body>
</html>
