<div class="controls-wrapper">
    <!-- Controles Izquierda -->
    <div class="controls-container-left">
        <button id="toggle-mode" class="control-btn" (click)="toggleTheme()" [title]="'FOOTER.CHANGE_THEME' | translate">
            @if (currentTheme === 'light') {
                <svg lucideMoon></svg>
            }
            @if (currentTheme === 'dark') {
                <svg lucideSun></svg>
            }
        </button>
        <div class="language-selector">
            <button id="toggle-language" class="control-btn lang-btn" (click)="toggleLanguageDropdown()" [title]="'FOOTER.CHANGE_LANGUAGE' | translate">
                <svg lucideLanguages></svg>
                <span class="selected-language">{{ selectedLanguage$ | async }}</span>
                @if (isLanguageDropdownVisible) {
                    <svg lucideChevronUp class="dropdown-arrow"></svg>
                } @else {
                    <svg lucideChevronDown class="dropdown-arrow"></svg>
                }
            </button>
            @if (isLanguageDropdownVisible) {
                <div class="language-dropdown">
                    <div class="language-option" (click)="selectLanguage('es')">
                        <span>{{ 'LANGUAGES.SPANISH' | translate }}</span>
                        @if (currentLang === 'es') {
                            <svg lucideCheck class="check-icon"></svg>
                        }
                    </div>
                    <div class="language-option" (click)="selectLanguage('en')">
                        <span>{{ 'LANGUAGES.ENGLISH' | translate }}</span>
                        @if (currentLang === 'en') {
                            <svg lucideCheck class="check-icon"></svg>
                        }
                    </div>
                </div>
            }
        </div>
    </div>

    <!-- Controles Derecha -->
    <div class="controls-container-right">
        @if (!isAppDownloadRoute) {
            <button id="app-download-btn" class="control-btn" routerLink="/app-download" [title]="'FOOTER.DOWNLOAD_APP' | translate">
                <svg class="brand-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path [attr.d]="androidIconPath"></path>
                </svg>
            </button>
        }
        <button id="whats-new-btn" class="control-btn" (click)="openWhatsNewModal()" [title]="'FOOTER.WHATS_NEW' | translate">
            <svg lucideSparkles></svg>
        </button>
        <button id="ayuda-btn" class="control-btn" (click)="openHelpModal()" [title]="'FOOTER.HELP' | translate">
            <svg lucideCircleQuestionMark></svg>
        </button>
    </div>
</div>


<footer>
    @if (madeByVisible$ | async) {
        <p>{{ 'FOOTER.MADE_BY' | translate }} <a href="https://donyaep.vercel.app/" target="_blank" class="dony">dony.</a></p>
    }
</footer>

<app-help-modal [isVisible]="isHelpModalVisible" (close)="closeHelpModal()"></app-help-modal>

<app-whats-new-modal [isVisible]="isWhatsNewModalVisible" (close)="closeWhatsNewModal()"></app-whats-new-modal>
