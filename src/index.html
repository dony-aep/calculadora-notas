<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>CalNotas · Calculadora de notas por cortes</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link id="app-favicon" rel="icon" type="image/png" href="assets/icons/calnotas-favicon-black-32.png">
  <meta name="theme-color" content="#121212">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  
  <meta name="description" content="Calcula tu nota por cortes y cuánto te falta para aprobar. Trae los porcentajes de la Universidad Americana (Colombia) o configura los tuyos.">
  <link rel="canonical" href="https://calnotas.vercel.app/">

  <!-- Open Graph Metadata -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CalNotas">
  <meta property="og:locale" content="es_CO">
  <meta property="og:title" content="CalNotas · Calculadora de notas">
  <meta property="og:description" content="Calcula tu nota por cortes y cuánto te falta para aprobar. Con los porcentajes de la Universidad Americana o los tuyos.">
  <meta property="og:url" content="https://calnotas.vercel.app/">
  <meta property="og:image" content="https://calnotas.vercel.app/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="CalNotas, calculadora de notas por cortes">

  <!-- Twitter Card Metadata -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="CalNotas · Calculadora de notas">
  <meta name="twitter:description" content="Calcula tu nota por cortes y cuánto te falta para aprobar. Con los porcentajes de la Universidad Americana o los tuyos.">
  <meta name="twitter:image" content="https://calnotas.vercel.app/og-image.png">
  <meta name="twitter:image:alt" content="CalNotas, calculadora de notas por cortes">

  <meta name="google" content="notranslate">
  <script>
    (() => {
      const favicon = document.getElementById('app-favicon');
      const colorScheme = window.matchMedia('(prefers-color-scheme: dark)');
      const updateFavicon = (isDark) => {
        favicon?.setAttribute(
          'href',
          isDark
            ? 'assets/icons/calnotas-favicon-white-32.png'
            : 'assets/icons/calnotas-favicon-black-32.png'
        );
      };

      updateFavicon(colorScheme.matches);

      if (typeof colorScheme.addEventListener === 'function') {
        colorScheme.addEventListener('change', (event) => updateFavicon(event.matches));
      } else if (typeof colorScheme.addListener === 'function') {
        colorScheme.addListener((event) => updateFavicon(event.matches));
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
  <noscript>
    <p>Please enable JavaScript to continue using this application.</p>
  </noscript>
</body>
</html>
